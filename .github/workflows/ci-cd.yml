
name: CollabManager CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: collabmanager-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # Detect which application has changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'CollabManagerbackend/**'
            frontend:
              - 'CollabManagerfrontend/frontend/**'

  # Backend tests
  backend-build:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: collab_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: CollabManagerbackend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/collab_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          RAZORPAY_API_KEY: test_key
          RAZORPAY_API_SECRET: test_secret
        run: |
          chmod +x mvnw
          ./mvnw clean verify

  # Frontend build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CollabManagerfrontend/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CollabManagerfrontend/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # Publish only the changed Docker images
  publish-docker-images:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - changes
      - backend-build
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./CollabManagerbackend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/richadubeyess/collabmanager-backend:latest
            ghcr.io/richadubeyess/collabmanager-backend:sha-${{ github.sha }}

      - name: Build and publish frontend image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./CollabManagerfrontend/frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/richadubeyess/collabmanager-frontend:latest
            ghcr.io/richadubeyess/collabmanager-frontend:sha-${{ github.sha }}

  # Deploy changed services through AWS Systems Manager
  deploy:
    name: Deploy to AWS EC2 through SSM
    runs-on: ubuntu-latest

    needs:
      - changes
      - publish-docker-images

    if: >-
      github.event_name == 'push' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true')

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy changed services using SSM
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend }}

        shell: bash

        run: |
          set -euo pipefail

          INSTANCE_ID="i-0085d18bbee179b0f"

          echo "Preparing remote deployment script..."

          REMOTE_SCRIPT=$(cat <<EOF
          set -e

          cd /home/ec2-user/CollabManager

          echo "Validating deployment configuration..."
          sudo docker compose config --quiet

          if [ "${DEPLOY_BACKEND}" = "true" ]; then
            echo "Deploying backend..."

            sudo sed -i \
              "s|^[[:space:]]*image: ghcr.io/richadubeyess/collabmanager-backend:.*|    image: ghcr.io/richadubeyess/collabmanager-backend:${IMAGE_TAG}|" \
              docker-compose.yml

            sudo docker compose pull backend
            sudo docker compose up -d --no-deps backend
          fi

          if [ "${DEPLOY_FRONTEND}" = "true" ]; then
            echo "Deploying frontend..."

            sudo sed -i \
              "s|^[[:space:]]*image: ghcr.io/richadubeyess/collabmanager-frontend:.*|    image: ghcr.io/richadubeyess/collabmanager-frontend:${IMAGE_TAG}|" \
              docker-compose.yml

            sudo docker compose pull frontend
            sudo docker compose up -d --no-deps frontend
          fi

          echo "Deployment completed."

          sudo docker compose ps
          EOF
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CollabManager deployment $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to finish..."

          STATUS="Pending"

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            case "$STATUS" in
              Failed|Cancelled|TimedOut|Undeliverable|Terminated|DeliveryTimedOut|ExecutionTimedOut)
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json

                exit 1
                ;;
            esac

            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment did not finish within 10 minutes."
            exit 1
          fi

          echo "Deployment succeeded!"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
