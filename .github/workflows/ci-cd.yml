
name: CollabManager CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: collabmanager-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # Detect which application has changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'CollabManagerbackend/**'
            frontend:
              - 'CollabManagerfrontend/frontend/**'

  # Backend tests
  backend-build:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: collab_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: CollabManagerbackend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/collab_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          RAZORPAY_API_KEY: test_key
          RAZORPAY_API_SECRET: test_secret
        run: |
          chmod +x mvnw
          ./mvnw clean verify

  # Frontend build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CollabManagerfrontend/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CollabManagerfrontend/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # Publish only the changed Docker images
  publish-docker-images:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - changes
      - backend-build
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./CollabManagerbackend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/richadubeyess/collabmanager-backend:latest
            ghcr.io/richadubeyess/collabmanager-backend:sha-${{ github.sha }}

      - name: Build and publish frontend image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./CollabManagerfrontend/frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/richadubeyess/collabmanager-frontend:latest
            ghcr.io/richadubeyess/collabmanager-frontend:sha-${{ github.sha }}

  # Automatically deploy changed services to EC2
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - changes
      - publish-docker-images

    if: >-
      github.event_name == 'push' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true')

    steps:
      - name: Deploy changed services
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,DEPLOY_BACKEND,DEPLOY_FRONTEND
          script: |
            set -e

            cd /home/ec2-user/CollabManager

            echo "Validating deployment configuration..."
            sudo docker compose config --quiet

            if [ "$DEPLOY_BACKEND" = "true" ]; then
              echo "Deploying backend..."

              sudo sed -i \
                "s|^[[:space:]]*image: ghcr.io/richadubeyess/collabmanager-backend:.*|    image: ghcr.io/richadubeyess/collabmanager-backend:${IMAGE_TAG}|" \
                docker-compose.yml

              sudo docker compose pull backend
              sudo docker compose up -d --no-deps backend
            fi

            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              echo "Deploying frontend..."

              sudo sed -i \
                "s|^[[:space:]]*image: ghcr.io/richadubeyess/collabmanager-frontend:.*|    image: ghcr.io/richadubeyess/collabmanager-frontend:${IMAGE_TAG}|" \
                docker-compose.yml

              sudo docker compose pull frontend
              sudo docker compose up -d --no-deps frontend
            fi

            echo "Deployment completed."

            sudo docker compose ps
